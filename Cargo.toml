[package]
name = "heliacal"
version = "0.1.0"
edition = "2024"
publish = false
description = "A Happy Years desktop frontend for the Helios SPARC emulator"

[dependencies]
helios = { path = "../helios" }
sdl3 = "0.20"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
png = "0.18"

[profile.dev.package.helios]
opt-level = 2

[profile.test.package.helios]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
