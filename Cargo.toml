[package]
name = "heliacal"
version = "0.1.0"
edition = "2024"
publish = false
description = "A Happy Years desktop frontend for the Helios SPARC emulator"

[features]
default = []
parking-profile = ["helios/parking-profile"]
jit-native = ["helios/jit-native"]
jit-profile = ["jit-native", "helios/jit-profile"]

[dependencies]
helios = { path = "../helios", features = ["chd", "host-icmp"] }
sdl3 = "0.20"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
png = "0.18"
crc32fast = "1"
vt100 = { version = "0.18.1", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["term", "fs"] }

[profile.dev.package.helios]
opt-level = 2

[profile.test.package.helios]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
